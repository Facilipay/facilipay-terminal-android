# The public guide for apps that call Facilipay on the terminal, published at
# https://developers.facilipay.io/terminal/ (staging: https://dev-developers.facilipay.io/terminal/).
#
# Build locally, from this folder:
#   python3 -m venv .venv && .venv/bin/pip install -r requirements.txt
#   .venv/bin/mkdocs serve        # or: mkdocs build --strict
#
# Code samples come from the sample app in this repository (../sample), which builds against the
# published library, so the guide only shows code that compiles. The API reference (pages/api) is
# generated by Dokka: ./gradlew :terminal-sdk:dokkaGeneratePublicationHtml, then copy
# terminal-sdk/build/dokka/html to pages/api.

site_name: Facilipay Terminal SDK
site_url: !ENV [TERMINAL_SITE_URL, "https://developers.facilipay.io/terminal/"]
# Pages are files (get-started.html), not folders: the developer site's CloudFront serves exact
# objects and doesn't add index.html to a folder URL. Publishing uploads index.html a second time
# as the object terminal/, so the bare /terminal/ URL works too.
use_directory_urls: false
site_description: >-
  Start gift card top-ups, redemptions and balance checks in Facilipay from your own Android app
  on a Facilipay terminal.
repo_url: https://github.com/Facilipay/facilipay-terminal-android
repo_name: facilipay-terminal-android
copyright: Copyright &copy; Facilipay. The guide and the code are released under the MIT License.
docs_dir: pages
edit_uri: edit/main/docs/pages/

theme:
  name: material
  logo: assets/facilipay-logo.png
  favicon: assets/facilipay-logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link

extra_css:
  - assets/facilipay.css

extra:
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      # The repository root, wherever mkdocs runs from: snippets come from sample/ and protocol/.
      base_path: !relative $config_dir/..
      check_paths: true
      dedent_subsections: true

plugins:
  - search
  - llmstxt:
      markdown_description: >-
        The Facilipay Terminal SDK (io.facilipay:terminal-sdk) lets an Android app on a Facilipay
        terminal start gift card top-ups, redemptions and balance checks in Facilipay, including a
        top-up where Facilipay charges the customer's card, and read a typed result.
      full_output: llms-full.txt
      sections:
        Start here:
          - index.md
          - get-started.md
        Guides:
          - gift/top-up.md
          - gift/redeem.md
          - gift/balance.md
          - results.md
          - testing.md
          - troubleshooting.md
        Reference:
          - reference/library.md
          - reference/intent-protocol.md
          - reference/response-codes.md
          - release-notes.md

nav:
  - Overview: index.md
  - Get started: get-started.md
  - Gift cards:
      - Top up a gift card: gift/top-up.md
      - Redeem from a gift card: gift/redeem.md
      - Check a balance: gift/balance.md
  - Handle results: results.md
  - Test your integration: testing.md
  - Troubleshooting: troubleshooting.md
  - Reference:
      - Library API: reference/library.md
      - Intent protocol: reference/intent-protocol.md
      - Response codes: reference/response-codes.md
  - Release notes: release-notes.md
