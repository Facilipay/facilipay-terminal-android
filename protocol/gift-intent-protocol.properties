# The Facilipay gift intent protocol: every name and value a third-party app and Facilipay share.
#
# Both sides check themselves against this file: the Terminal SDK here (GiftProtocolContractTest)
# and Facilipay's own app (from a copy pinned to a commit of this repository). To change the
# protocol, change this file first, then the app. Add only: older Facilipay versions on terminals
# may still send a value, so removing one needs a new protocol version.
#
# Format: KEY=value, one per line; # comments and blank lines are allowed. No spaces around =,
# no empty values, no duplicate keys, numbers as plain digits.

# Protocol version and action
API_VERSION=2
API_VERSION_1=1
API_VERSION_2=2
ACTION_GIFT_TRANSACTION=com.facilipay.pos.action.GIFT_TRANSACTION

# Permission: Facilipay's package name followed by this suffix
PERMISSION_SUFFIX=.permission.GIFT_INTEGRATION

# The Facilipay app on PAX terminals
DEFAULT_PACKAGE=com.facilipay.pax.pos

# Request extras
EXTRA_REQUEST_ID=com.facilipay.pos.extra.REQUEST_ID
EXTRA_OPERATION=com.facilipay.pos.extra.OPERATION
EXTRA_AMOUNT_MINOR=com.facilipay.pos.extra.AMOUNT_MINOR
EXTRA_PAYMENT_COLLECTED=com.facilipay.pos.extra.PAYMENT_COLLECTED
EXTRA_ALLOW_PARTIAL=com.facilipay.pos.extra.ALLOW_PARTIAL
EXTRA_CURRENCY=com.facilipay.pos.extra.CURRENCY
EXTRA_API_VERSION=com.facilipay.pos.extra.API_VERSION

# Limits
MAX_REQUEST_ID_LENGTH=128
MAX_AMOUNT_MINOR=99999999

# Operations
OPERATION_TOPUP=TOPUP
OPERATION_REDEEM=REDEEM
OPERATION_BALANCE=BALANCE

# Result extras
RESULT_STATUS=com.facilipay.pos.result.STATUS
RESULT_REQUEST_ID=com.facilipay.pos.result.REQUEST_ID
RESULT_SEQUENCE_NO=com.facilipay.pos.result.SEQUENCE_NO
RESULT_RESPONSE_CODE=com.facilipay.pos.result.RESPONSE_CODE
RESULT_MESSAGE=com.facilipay.pos.result.MESSAGE
RESULT_TRANSACTION_TYPE=com.facilipay.pos.result.TRANSACTION_TYPE
RESULT_TRANSACTION_UID=com.facilipay.pos.result.TRANSACTION_UID
RESULT_AMOUNT_MINOR=com.facilipay.pos.result.AMOUNT_MINOR
RESULT_BALANCE_MINOR=com.facilipay.pos.result.BALANCE_MINOR
RESULT_AUTH_CODE=com.facilipay.pos.result.AUTH_CODE
RESULT_MASKED_PAN=com.facilipay.pos.result.MASKED_PAN
RESULT_RECEIPT_TEXT=com.facilipay.pos.result.RECEIPT_TEXT

# Result extras for the card payment Facilipay takes (top-up charged to the card)
RESULT_PAYMENT_STATUS=com.facilipay.pos.result.PAYMENT_STATUS
RESULT_PAYMENT_RESPONSE_CODE=com.facilipay.pos.result.PAYMENT_RESPONSE_CODE
RESULT_PAYMENT_REFERENCE=com.facilipay.pos.result.PAYMENT_REFERENCE
RESULT_PAYMENT_AUTH_CODE=com.facilipay.pos.result.PAYMENT_AUTH_CODE
RESULT_PAYMENT_MASKED_PAN=com.facilipay.pos.result.PAYMENT_MASKED_PAN
RESULT_PAYMENT_AMOUNT_MINOR=com.facilipay.pos.result.PAYMENT_AMOUNT_MINOR
RESULT_PAYMENT_RECEIPT_TEXT=com.facilipay.pos.result.PAYMENT_RECEIPT_TEXT

# Payment statuses
PAYMENT_STATUS_NOT_TAKEN=NOT_TAKEN
PAYMENT_STATUS_APPROVED=APPROVED
PAYMENT_STATUS_DECLINED=DECLINED
PAYMENT_STATUS_CANCELLED=CANCELLED
PAYMENT_STATUS_UNKNOWN=UNKNOWN

# Statuses
STATUS_APPROVED=APPROVED
STATUS_CANCELLED=CANCELLED
STATUS_ERROR=ERROR
STATUS_UNKNOWN=UNKNOWN

# Response codes Facilipay itself sets for this intent
CODE_MALFORMED=30
CODE_UNKNOWN_OPERATION=12
CODE_INVALID_AMOUNT=13
CODE_NOT_ENABLED=58
CODE_NOT_LOGGED_IN=27
CODE_IN_PROGRESS=09
CODE_DUPLICATE=94
CODE_NOT_STARTED=21
CODE_OUTCOME_UNKNOWN=22
CODE_PAID_NOT_CREDITED=PC
